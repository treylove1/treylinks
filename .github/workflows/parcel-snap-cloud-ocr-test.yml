name: Parcel Snap Cloud OCR Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "parcel-snap-owner-preview/app.js"
      - "parcel-snap-owner-preview/tests/**"
      - ".github/workflows/parcel-snap-cloud-ocr-test.yml"

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils imagemagick

      - name: Download public shipping label sample
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://doc.phomemo.com/Labels-Sample.pdf" \
            -o /tmp/sample-label.pdf

      - name: Render clean label
        run: |
          mkdir -p parcel-snap-owner-preview/tests/artifacts
          pdftoppm -f 1 -singlefile -png -r 300 \
            /tmp/sample-label.pdf \
            parcel-snap-owner-preview/tests/artifacts/sample-clean
          tesseract \
            parcel-snap-owner-preview/tests/artifacts/sample-clean.png \
            parcel-snap-owner-preview/tests/artifacts/sample-clean \
            --psm 6

      - name: Evaluate clean label
        run: |
          node parcel-snap-owner-preview/tests/cloud-ocr-eval.mjs \
            parcel-snap-owner-preview/tests/artifacts/sample-clean.txt \
            "John Smith" \
            "8888888888888888888888" \
            "Public USPS-style sample — clean"

      - name: Create warehouse-photo stress sample
        run: |
          convert parcel-snap-owner-preview/tests/artifacts/sample-clean.png \
            -background "#8b6f47" \
            -rotate 6 \
            -resize 68% \
            -blur 0x0.7 \
            -quality 68 \
            parcel-snap-owner-preview/tests/artifacts/sample-warehouse.jpg
          tesseract \
            parcel-snap-owner-preview/tests/artifacts/sample-warehouse.jpg \
            parcel-snap-owner-preview/tests/artifacts/sample-warehouse \
            --psm 6

      - name: Recover angled warehouse photo
        run: |
          convert parcel-snap-owner-preview/tests/artifacts/sample-warehouse.jpg \
            -deskew 40% \
            -colorspace Gray \
            -contrast-stretch 1%x1% \
            -sharpen 0x1 \
            parcel-snap-owner-preview/tests/artifacts/sample-recovered.png

          tesseract \
            parcel-snap-owner-preview/tests/artifacts/sample-recovered.png \
            parcel-snap-owner-preview/tests/artifacts/sample-recovered-psm6 \
            --psm 6

          tesseract \
            parcel-snap-owner-preview/tests/artifacts/sample-recovered.png \
            parcel-snap-owner-preview/tests/artifacts/sample-recovered-psm11 \
            --psm 11

          cat \
            parcel-snap-owner-preview/tests/artifacts/sample-recovered-psm6.txt \
            parcel-snap-owner-preview/tests/artifacts/sample-recovered-psm11.txt \
            > parcel-snap-owner-preview/tests/artifacts/sample-recovered-merged.txt

      - name: Evaluate recovered warehouse photo
        run: |
          node parcel-snap-owner-preview/tests/cloud-ocr-eval.mjs \
            parcel-snap-owner-preview/tests/artifacts/sample-recovered-merged.txt \
            "John Smith" \
            "8888888888888888888888" \
            "Public USPS-style sample — deskewed multi-pass"

      - name: Upload OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcel-snap-cloud-ocr-evidence
          path: parcel-snap-owner-preview/tests/artifacts
          retention-days: 14
