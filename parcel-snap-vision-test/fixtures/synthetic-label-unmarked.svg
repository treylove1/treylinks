  <rect width="1600" height="1000" fill="#ececea"/>
  <rect x="90" y="70" width="1420" height="860" fill="#fff" stroke="#161616" stroke-width="8"/>
  <rect x="110" y="90" width="1380" height="64" fill="#242424"/>
  <text x="130" y="134" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" fill="#fff">SYNTHETIC LABEL — TEST ONLY — NOT VALID FOR SHIPPING</text>
