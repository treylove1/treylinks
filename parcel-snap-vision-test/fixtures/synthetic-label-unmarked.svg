  <text x="140" y="700" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700">CARRIER: UPS (FICTIONAL TEST)</text>
  <text x="140" y="780" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700">TRACKING: 1ZTEST000000000001</text>
